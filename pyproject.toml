[project]
name = "pokerassist"
version = "0.1.0"
description = "No-Limit Hold'em decision assistant: deterministic engine + LLM explanation layer"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2.6", "fastapi>=0.115", "uvicorn>=0.30", "anthropic>=1.17"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "treys==0.1.8"]
fast = ["eval7==0.1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["slow: long-running accuracy checks"]
